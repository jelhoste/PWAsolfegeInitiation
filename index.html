<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solfège — apprendre à lire la musique</title>
<meta name="description" content="Apprends le solfège avec des cours clairs, des jeux de lecture de notes, de rythme et de théorie, et des outils pour musiciens.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solfège">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.1/dist/abcjs-basic-min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#1B2440;
  --ink-soft:#4C5A82;
  --paper:#FBF7EF;
  --paper-2:#F1EAD9;
  --paper-3:#E7DCC3;
  --brass:#B8912F;
  --brass-deep:#8C6D1F;
  --brass-soft:#E4CE8F;
  --sage:#3F7A5E;
  --sage-soft:#D8E8DE;
  --brick:#B14A3D;
  --brick-soft:#F3DBD6;
  --line: rgba(27,36,64,0.14);
  --line-strong: rgba(27,36,64,0.26);
  --shadow: 0 1px 0 rgba(27,36,64,0.06);
  --radius: 10px;
  --bg: var(--paper);
  --bg-2: var(--paper-2);
  --bg-3: var(--paper-3);
  --fg: var(--ink);
  --fg-soft: var(--ink-soft);
  --rule: var(--line);
  --rule-strong: var(--line-strong);
  --accent: var(--brass);
  --accent-deep: var(--brass-deep);
  --accent-soft: var(--brass-soft);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161C30; --bg-2:#1E2740; --bg-3:#262F4C;
    --fg:#F3EFE3; --fg-soft:#B9C0DA;
    --rule: rgba(243,239,227,0.14); --rule-strong: rgba(243,239,227,0.26);
    --accent: var(--brass-soft); --accent-deep: var(--brass); --accent-soft: rgba(184,145,47,0.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161C30; --bg-2:#1E2740; --bg-3:#262F4C;
  --fg:#F3EFE3; --fg-soft:#B9C0DA;
  --rule: rgba(243,239,227,0.14); --rule-strong: rgba(243,239,227,0.26);
  --accent: var(--brass-soft); --accent-deep: var(--brass); --accent-soft: rgba(184,145,47,0.22);
  color-scheme: dark;
}
/* High-contrast theme for low vision, built to WCAG 2.2 AAA targets (1.4.6 Contrast Enhanced):
   pure black/white for ~21:1 body-text contrast, a single unmistakable accent colour,
   and every interactive element gets a heavy, always-visible outline rather than relying on colour alone. */
:root[data-theme="contrast"]{
  --bg:#000000; --bg-2:#000000; --bg-3:#111111;
  --fg:#FFFFFF; --fg-soft:#FFFFFF;
  --rule:#FFFFFF; --rule-strong:#FFFFFF;
  --accent:#FFD400; --accent-deep:#FFD400; --accent-soft:#3A2F00;
  --sage:#33FF6B; --sage-soft:#003318;
  --brick:#FF5C5C; --brick-soft:#3A0000;
  color-scheme: dark;
}
:root[data-theme="contrast"] *{ text-shadow:none !important; box-shadow:none !important; }
:root[data-theme="contrast"] .card,
:root[data-theme="contrast"] .staff-box,
:root[data-theme="contrast"] .figure-wrap,
:root[data-theme="contrast"] .callout,
:root[data-theme="contrast"] .ans-btn,
:root[data-theme="contrast"] .chip,
:root[data-theme="contrast"] .progress-pill,
:root[data-theme="contrast"] .tuner-bar-wrap{ border:2px solid #FFFFFF; }
:root[data-theme="contrast"] .btn{ border:2px solid #FFFFFF; }
:root[data-theme="contrast"] .btn-primary{ background:#FFFFFF; color:#000000; }
:root[data-theme="contrast"] .btn-accent,
:root[data-theme="contrast"] .chip.active{ background:#FFD400; color:#000000; border-color:#FFD400; }
:root[data-theme="contrast"] .ans-btn.correct{ background:#003318; border-color:#33FF6B; color:#33FF6B; }
:root[data-theme="contrast"] .ans-btn.wrong{ background:#3A0000; border-color:#FF5C5C; color:#FF5C5C; }
:root[data-theme="contrast"] .topbar{ background:#000000; border-bottom:2px solid #FFFFFF; backdrop-filter:none; }
:root[data-theme="contrast"] a:focus-visible,
:root[data-theme="contrast"] button:focus-visible,
:root[data-theme="contrast"] input:focus-visible{ outline:3px solid #FFD400; outline-offset:3px; }
*{box-sizing:border-box;}
html{scroll-padding-top: calc(64px + env(safe-area-inset-top,0px));}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  transition: background .25s ease, color .25s ease;
}
h1,h2,h3,.serif{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; color:var(--fg); }
p{ line-height:1.65; color:var(--fg-soft); }
a{ color:inherit; }
button{ font-family:inherit; }
/* abcjs draws its own SVG with black presentation attributes; presentation attributes sit at the
   bottom of the CSS cascade, so a plain rule here reliably recolors every shape to the current theme. */
.abc-notation{ overflow-x:auto; }
.abc-notation svg{ width:100%; height:auto; display:block; }
.abc-notation svg path, .abc-notation svg text, .abc-notation svg rect,
.abc-notation svg line, .abc-notation svg ellipse, .abc-notation svg polygon{
  fill:var(--fg) !important; stroke:var(--fg) !important;
}
.abc-play-btn{
  display:block; margin:8px auto 0; padding:6px 16px; border-radius:999px;
  border:1px solid var(--rule-strong); background:var(--bg-3); color:var(--fg);
  font-size:.82rem; font-weight:600; cursor:pointer;
}
.abc-play-btn:hover{ border-color:var(--accent-deep); }
.abc-play-btn:disabled{ opacity:.6; cursor:default; }

/* ============ LAYOUT ============ */
#app{ max-width:1080px; margin:0 auto; padding:0 20px; }
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding: calc(14px + env(safe-area-inset-top,0px)) 20px 14px;
  margin: 0 -20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom:1px solid var(--rule);
}
.brand{ display:flex; align-items:center; gap:8px; text-decoration:none; font-family:'Fraunces',serif; font-weight:700; font-size:1.3rem; color:var(--fg); }
.brand .brand-note{ color:var(--accent-deep); font-size:1.5rem; }
nav.mainnav{ display:flex; gap:4px; align-items:center; }
nav.mainnav a{
  text-decoration:none; padding:8px 14px; border-radius:999px; font-size:.95rem; font-weight:500;
  color:var(--fg-soft); border:1px solid transparent;
}
nav.mainnav a.active, nav.mainnav a:hover{ color:var(--fg); border-color:var(--rule); background:var(--bg-2); }
.icon-btn{
  border:1px solid var(--rule); background:var(--bg-2); color:var(--fg);
  width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1rem;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--accent-deep); outline-offset:2px; }

main{ padding: 40px 0 80px; min-height:60vh; }

/* staff rule divider — recurring motif */
.staff-rule{ width:100%; height:34px; margin:36px 0; opacity:.55; }
.staff-rule svg{ width:100%; height:100%; display:block; }
.staff-rule line{ stroke:var(--rule-strong); stroke-width:1; }

/* ============ HERO ============ */
.hero{ padding: 20px 0 10px; }
.hero-grid{ display:grid; grid-template-columns: 1.15fr 0.85fr; gap:40px; align-items:center; }
@media (max-width:760px){ .hero-grid{ grid-template-columns:1fr; } }
.eyebrow-note{ display:inline-flex; align-items:center; gap:8px; color:var(--accent-deep); font-weight:600; font-size:.85rem; margin-bottom:14px;}
h1.hero-title{ font-size: clamp(2.1rem, 4.6vw, 3.4rem); line-height:1.08; margin:0 0 18px; }
.hero-title em{ font-style:italic; color:var(--accent-deep); }
.hero-sub{ font-size:1.08rem; max-width:46ch; margin-bottom:26px;}
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; }
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px;
  text-decoration:none; font-weight:600; font-size:.98rem; cursor:pointer; border:1px solid transparent;
  transition: transform .15s ease;
}
.btn:active{ transform: scale(.97); }
.btn-primary{ background:var(--ink); color:var(--paper); }
:root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){ }
.btn-primary{ background:var(--fg); color:var(--bg); }
.btn-ghost{ background:transparent; border-color:var(--rule-strong); color:var(--fg); }
.btn-ghost:hover{ background:var(--bg-2); }
.btn-accent{ background:var(--accent-deep); color:#fff; }

.clef-art{ display:flex; justify-content:center; }
.clef-art svg{ width:100%; max-width:260px; height:auto; }
.clef-path{ fill:none; stroke:var(--fg); stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
.clef-draw{ stroke-dasharray: 900; stroke-dashoffset:900; animation: draw 1.6s ease forwards .2s; }
@media (prefers-reduced-motion: reduce){ .clef-draw{ animation:none; stroke-dashoffset:0; } }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* ============ CARDS / GRIDS ============ */
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap;}
.section-head h2{ font-size:1.6rem; margin:0; }
.section-head p{ margin:0; max-width:50ch; }
.grid{ display:grid; gap:16px; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); }
.card{
  display:block; text-decoration:none; color:inherit;
  border:1px solid var(--rule); border-radius: var(--radius);
  padding:20px; background:var(--bg-2);
  cursor:pointer;
}
.card:hover{ border-color:var(--accent-deep); }
.card .k{ font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-deep); font-weight:700; }
.card h3{ margin:8px 0 6px; font-size:1.15rem; }
.card p{ margin:0; font-size:.92rem; }
.card .meta{ margin-top:14px; font-size:.82rem; color:var(--fg-soft); display:flex; gap:14px; }

/* breadcrumb / back */
.crumb{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--fg-soft); font-size:.9rem; margin-bottom:22px; }
.crumb:hover{ color:var(--fg); }

/* Lesson page */
.lesson-head h2{ font-size:2rem; margin:0 0 10px;}
.lesson-body{ max-width:70ch; }
.lesson-body h3{ font-size:1.2rem; margin:34px 0 10px; }
.lesson-body ul{ color:var(--fg-soft); line-height:1.7; padding-left:1.2em; }
.callout{
  border-left:3px solid var(--accent-deep); background:var(--bg-2); padding:14px 18px; border-radius:0 8px 8px 0; margin:20px 0;
  font-size:.95rem;
}
.figure-wrap{ margin:22px 0; padding:18px; border:1px solid var(--rule); border-radius:var(--radius); background:var(--bg-2); overflow-x:auto; }
.figure-cap{ text-align:center; font-size:.82rem; color:var(--fg-soft); margin-top:8px; }
table.durations{ width:100%; border-collapse:collapse; font-size:.92rem; }
table.durations th, table.durations td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--rule); }
table.durations th{ color:var(--fg-soft); font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; }
.form-diagram{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
.form-block{ padding:18px 24px; border-radius:10px; font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem; border:1px solid var(--rule-strong); background:var(--bg-3); color:var(--fg-soft); }
.form-a{ background:var(--accent-soft); color:var(--accent-deep); border-color:var(--accent-deep); }
.form-b{ background:var(--bg-3); color:var(--fg); }
.form-theme{ background:var(--sage-soft); color:var(--sage); border-color:var(--sage); }
.form-var{ background:var(--bg-2); color:var(--fg-soft); font-size:.9rem; }

/* ============ GAME UI ============ */
.game-shell{ max-width:640px; margin:0 auto; }
.game-hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:12px; flex-wrap:wrap; }
.hud-stat{ font-size:.82rem; color:var(--fg-soft); }
.hud-stat b{ color:var(--fg); font-size:1.1rem; display:block; font-family:'Fraunces',serif; }
.staff-box{
  background: var(--bg-2); border:1px solid var(--rule); border-radius: var(--radius);
  padding: 30px 20px; margin-bottom:26px; display:flex; justify-content:center;
}
.staff-box svg{ width:100%; max-width:420px; height:auto; overflow:visible; }
.figure-wrap svg{ overflow:visible; }
.ledger{ stroke:var(--fg-soft); stroke-width:1.4; }
.answers{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:10px; }
.ans-btn{
  padding:14px 8px; border-radius:10px; border:1px solid var(--rule-strong); background:var(--bg-2); color:var(--fg);
  font-weight:600; font-size:1rem; cursor:pointer; font-family:'Fraunces',serif;
}
.ans-btn:hover{ border-color:var(--accent-deep); }
.ans-btn.correct{ background:var(--sage-soft); border-color:var(--sage); color:var(--sage); }
.ans-btn.wrong{ background:var(--brick-soft); border-color:var(--brick); color:var(--brick); }
.feedback{ text-align:center; min-height:28px; font-weight:600; margin-top:16px; }
.feedback.ok{ color:var(--sage); }
.feedback.no{ color:var(--brick); }
.game-intro{ max-width:60ch; }
.diff-row{ display:flex; gap:8px; margin:18px 0 26px; flex-wrap:wrap; }
.chip{ padding:8px 16px; border-radius:999px; border:1px solid var(--rule-strong); background:var(--bg-2); cursor:pointer; font-size:.88rem; font-weight:600; }
.chip.active{ background:var(--accent-deep); color:#fff; border-color:var(--accent-deep); }

/* rhythm */
.beat-row{ display:flex; gap:10px; justify-content:center; align-items:flex-end; margin:20px 0 30px; flex-wrap:wrap; min-height:90px; }
.beat-note{ width:34px; height:60px; display:flex; align-items:flex-end; justify-content:center; opacity:.5; transition:opacity .1s, transform .1s;}
.beat-note svg{ width:100%; height:100%; }
.beat-note.active{ opacity:1; transform:scale(1.15); }
.tap-pad{
  width:100%; padding:26px; border-radius:16px; border:2px solid var(--accent-deep); background:var(--accent-soft);
  font-family:'Fraunces',serif; font-size:1.3rem; font-weight:600; color:var(--fg); cursor:pointer;
}
.tap-pad:active{ transform:scale(.98); }
.hit-row{ display:flex; gap:6px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
.hit{ width:14px; height:14px; border-radius:50%; background:var(--rule-strong); }
.hit.good{ background:var(--sage); }
.hit.mid{ background:var(--accent-deep); }
.hit.bad{ background:var(--brick); }

/* ============ TOOLS ============ */
.tool-shell{ max-width:600px; margin:0 auto; text-align:center; }
.bpm-display{ font-family:'Fraunces',serif; font-size:4rem; margin:6px 0; }
.bpm-label{ color:var(--fg-soft); font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; }
input[type=range]{ width:100%; accent-color: var(--accent-deep); margin:18px 0; }
.pendulum-wrap{ display:flex; justify-content:center; margin:20px 0 10px; }
.pendulum-dot{ width:22px; height:22px; border-radius:50%; background:var(--accent-deep); transition: transform .05s linear; }
.tool-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
.time-sig-row{ display:flex; gap:8px; justify-content:center; margin:14px 0; }

.tuner-face{ width:220px; height:130px; margin:20px auto; position:relative; }
.tuner-note{ font-family:'Fraunces',serif; font-size:3.2rem; margin:10px 0 0; }
.tuner-cents{ font-size:.9rem; color:var(--fg-soft); }
.tuner-bar-wrap{ width:100%; max-width:340px; margin:20px auto; height:10px; border-radius:6px; background:var(--bg-3); position:relative; overflow:hidden; }
.tuner-bar-mid{ position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--rule-strong); }
.tuner-needle{ position:absolute; top:0; bottom:0; width:6px; border-radius:3px; background:var(--fg-soft); left:50%; transform:translateX(-50%); transition: left .08s linear, background .15s; }

.piano-wrap{ overflow-x:auto; padding:10px 0 20px; }
.piano{ position:relative; height:170px; display:flex; width:max-content; margin:0 auto; user-select:none; }
.pkey{ position:relative; border:1px solid var(--ink); border-radius:0 0 6px 6px; cursor:pointer; }
.pkey.white{ width:46px; height:168px; background:#fffdf7; z-index:1; }
:root[data-theme="dark"] .pkey.white{ background:#EDE7D6; }
.pkey.black{ width:28px; height:104px; background:#181818; margin-left:-14px; margin-right:-14px; z-index:2; border-radius:0 0 4px 4px; }
.pkey.active.white{ background: var(--accent-soft); }
.pkey.active.black{ background: var(--accent-deep); }
.pkey .lbl{ position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:.65rem; color:#8a8a8a; }
.pkey.black .lbl{ color:#ddd; }

/* footer */
.site-footer{ padding: 10px 0 50px; text-align:center; }
.site-footer p{ font-size:.82rem; }

/* toast for progress save */
.toast{
  position:fixed; bottom: calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); padding:10px 20px; border-radius:999px; font-size:.85rem; opacity:0;
  transition: opacity .25s, transform .25s; pointer-events:none; z-index:100;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.progress-strip{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
.progress-pill{ flex:0 0 auto; border:1px solid var(--rule); border-radius:12px; padding:12px 18px; background:var(--bg-2); min-width:130px; }
.progress-pill b{ display:block; font-family:'Fraunces',serif; font-size:1.4rem; }
.progress-pill span{ font-size:.78rem; color:var(--fg-soft); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-note">♪</span> Solfège</a>
    <nav class="mainnav" id="mainnav">
      <a href="#/cours">Cours</a>
      <a href="#/jeux">Jeux</a>
      <a href="#/outils">Outils</a>
    </nav>
    <button class="icon-btn" id="theme-toggle" aria-label="Changer de thème" title="Changer de thème">◐</button>
  </header>
  <main id="view"></main>
  <footer class="site-footer">
    <div class="staff-rule" aria-hidden="true"><svg viewBox="0 0 600 34" preserveAspectRatio="none"><line x1="0" y1="4" x2="600" y2="4"/><line x1="0" y1="11" x2="600" y2="11"/><line x1="0" y1="18" x2="600" y2="18"/><line x1="0" y1="25" x2="600" y2="25"/><line x1="0" y1="32" x2="600" y2="32"/></svg></div>
    <p>Projet pédagogique indépendant pour apprendre à lire la musique, à votre rythme. Fonctionne aussi hors-ligne une fois installé.</p>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ======================================================================
   UTILITAIRES
====================================================================== */
const $view = document.getElementById('view');
const $toast = document.getElementById('toast');
function toast(msg){ $toast.textContent = msg; $toast.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>$toast.classList.remove('show'), 2200); }

function loadStore(){ try{ return JSON.parse(localStorage.getItem('solfege_progress')||'{}'); }catch(e){ return {}; } }
function saveStore(s){ try{ localStorage.setItem('solfege_progress', JSON.stringify(s)); }catch(e){} }
function recordScore(gameId, score, total){
  const s = loadStore();
  s.games = s.games||{};
  const g = s.games[gameId]||{best:0, played:0};
  g.played += 1;
  if (score > g.best) g.best = score;
  g.last = score; g.lastTotal = total;
  s.games[gameId] = g;
  saveStore(s);
}

const FR_NOTE = {C:'Do', D:'Ré', E:'Mi', F:'Fa', G:'Sol', A:'La', B:'Si'};
const LETTER_VAL = {C:0,D:1,E:2,F:3,G:4,A:5,B:6};
const LETTER_ORDER = ['C','D','E','F','G','A','B'];

function stepIndex(letter, octave){ return octave*7 + LETTER_VAL[letter]; }

/* ======================================================================
   ROUTER
====================================================================== */
const routes = [];
function route(pattern, render){ routes.push({pattern, render}); }
function matchRoute(hash){
  for (const r of routes){
    const m = hash.match(r.pattern);
    if (m) return {render:r.render, params:m.slice(1)};
  }
  return null;
}
function navigate(){
  const hash = location.hash || '#/';
  const m = matchRoute(hash);
  document.querySelectorAll('#mainnav a').forEach(a=>{
    a.classList.toggle('active', hash.startsWith(a.getAttribute('href')) && a.getAttribute('href')!=='#/');
  });
  window.scrollTo(0,0);
  if (currentCleanup) { try{ currentCleanup(); }catch(e){} currentCleanup=null; }
  if (m){
    const result = m.render(...m.params);
    if (typeof result === 'function') currentCleanup = result;
  } else {

    render(){ return `
      <p>La <strong>mesure</strong> découpe le temps en groupes réguliers. Elle est annoncée en début de portée par deux chiffres superposés, le <strong>chiffrage de mesure</strong> : le chiffre du haut indique combien de temps contient chaque mesure, celui du bas indique quelle figure de note représente un temps (4 = la noire, 8 = la croche...).</p>

      <p>Quand chaque temps se subdivise naturellement en deux (comme la noire en deux croches), la mesure est dite <strong>binaire</strong> : c'est le cas de 2/4, 3/4 et 4/4. Quand chaque temps se subdivise en trois, elle est dite <strong>ternaire</strong> — ce sont les mesures composées comme 6/8, 9/8 ou 12/8, où l'unité de temps réelle est un groupe de trois croches.</p>

    render(){ return `
      <p>Le <strong>cercle des quintes</strong> range les douze tonalités majeures autour d'un cercle : en partant de Do en haut et en tournant dans le sens des aiguilles d'une montre, chaque tonalité est à une <strong>quinte juste</strong> au-dessus de la précédente, et gagne exactement un dièse à son armure. Dans l'autre sens, chaque tonalité gagne un bémol.</p>

      </div>
      <h3>À quoi ça sert ?</h3>
      <p>Ce cercle rend visible d'un coup d'œil ce que le jeu <em>Tonalités</em> entraîne à faire dans l'autre sens : retrouver une armure à partir d'un nom de tonalité, ou l'inverse. Deux tonalités voisines sur le cercle ne diffèrent que d'une seule altération, ce qui explique pourquoi elles s'enchaînent naturellement bien en musique — c'est une des raisons pour lesquelles tant de morceaux modulent vers leur voisine immédiate.</p>
      <p>Le cercle relie aussi chaque tonalité majeure à sa relative mineure (vue dans la leçon sur les gammes mineures) : elles occupent la même position sur le cercle, puisqu'elles partagent la même armure.</p>
    `; }

      <p>Pour une évolution progressive plutôt qu'un changement brusque, on utilise un <strong>crescendo</strong> (on augmente peu à peu) ou un <strong>decrescendo</strong> / <strong>diminuendo</strong> (on diminue peu à peu), souvent notés par un « soufflet » qui s'ouvre ou se referme sous la portée.</p>

      <h3>Le tempo</h3>

    summary:"Empiler des tierces pour former un accord parfait majeur ou mineur.",
    render(){ return `
      <p>Un <strong>accord</strong> est un ensemble d'au moins trois notes jouées simultanément. Le plus simple et le plus courant est l'<strong>accord parfait</strong>, ou <strong>triade</strong> : une fondamentale, surmontée de deux tierces empilées.</p>
      <h3>Accord majeur</h3>
      <p>Tierce majeure (4 demi-tons) puis tierce mineure (3 demi-tons) au-dessus : par exemple Do (fondamentale) – Mi (tierce) – Sol (quinte) pour l'accord de Do majeur. C'est cet empilement précis qui donne à l'accord majeur sa couleur ouverte et stable.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-chord-major"></div>
        <p class="figure-cap">Accord de Do majeur : Do – Mi – Sol.</p>
      </div>
      <h3>Accord mineur</h3>
      <p>L'ordre s'inverse : tierce mineure (3 demi-tons) puis tierce majeure (4 demi-tons). La mineur, par exemple, s'obtient avec La – Do – Mi. Une seule note change de place par rapport à un accord majeur construit sur la même fondamentale, mais l'effet sonore est immédiatement reconnaissable — plus sombre, plus intérieur.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-chord-minor"></div>
        <p class="figure-cap">Accord de La mineur : La – Do – Mi.</p>
      </div>
      <div class="callout">Chaque degré d'une gamme porte naturellement son propre accord (construit avec les notes de cette gamme) : en Do majeur, le 1<sup>er</sup> degré donne Do majeur, le 6<sup>e</sup> degré donne La mineur — exactement la tonique et sa relative mineure retrouvées dans les leçons précédentes.</div>
      <p>Au-delà de la triade, on peut empiler une tierce supplémentaire (accord de septième), ou resserrer/écarter les tierces pour obtenir des accords diminués ou augmentés — des nuances qu'il est temps d'explorer une fois ces deux accords de base bien reconnus à l'oreille.</p>
    `; },
    mount(){
      renderABC('abc-chord-major', abcTune('treble', `[${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}]`), {staffwidth:220, audio:true});
      renderABC('abc-chord-minor', abcTune('treble', `[${toABC('A',3)}${toABC('C',4)}${toABC('E',4)}]`), {staffwidth:220, audio:true});
    }

  {
    id:'degres-gamme', title:'Les degrés de la gamme', duration:'5 min',
    summary:"Le nom et le rôle de chaque note d'une gamme : tonique, dominante, sensible...",
    render(){ return `
      <p>Dans une gamme, chaque note occupe une place précise numérotée de I à VII (en chiffres romains), et cette place — le <strong>degré</strong> — porte un nom qui décrit son rôle plutôt que sa hauteur. Deux morceaux dans des tonalités différentes peuvent ainsi partager exactement la même fonction de degré en degré, même si les notes elles-mêmes changent.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-degres"></div>
        <p class="figure-cap">Les sept degrés de Do majeur, numérotés.</p>
      </div>
      <div class="figure-wrap">
        <table class="durations">
          <tr><th>Degré</th><th>Nom</th><th>Rôle</th></tr>
          <tr><td>I</td><td>Tonique</td><td>la note de repos, la « maison » de la tonalité</td></tr>
          <tr><td>II</td><td>Sus-tonique</td><td>juste au-dessus de la tonique</td></tr>
          <tr><td>III</td><td>Médiante</td><td>à mi-chemin entre tonique et dominante ; c'est elle qui distingue une gamme majeure d'une gamme mineure</td></tr>
          <tr><td>IV</td><td>Sous-dominante</td><td>symétrique de la dominante, sous la tonique</td></tr>
          <tr><td>V</td><td>Dominante</td><td>la plus tendue après la sensible ; appelle presque toujours un retour à la tonique</td></tr>
          <tr><td>VI</td><td>Sus-dominante</td><td>juste au-dessus de la dominante</td></tr>
          <tr><td>VII</td><td>Sensible</td><td>à un demi-ton seulement de la tonique ; « tire » fortement vers elle</td></tr>
        </table>
      </div>
      <div class="callout">Cette numérotation s'applique aussi bien aux gammes mineures qu'aux gammes majeures — la <strong>sensible</strong>, en particulier, joue le même rôle central dans la gamme mineure harmonique vue plus tôt : c'est justement le 7<sup>e</sup> degré qu'on y hausse d'un demi-ton pour lui redonner cette tension.</div>
      <p>Les degrés servent aussi de base à l'harmonie : un accord construit sur le premier degré (I) est l'accord de tonique, sur le cinquième (V) l'accord de dominante — la relation la plus fondamentale de toute la musique tonale, celle qui donne l'impression de « partir » puis de « revenir à la maison ».</p>
    `; },
    mount(){
      renderABC('abc-degres',
        `X:1\nL:1/4\nK:C clef=treble\n${toABC('C',4)}${toABC('D',4)}${toABC('E',4)}${toABC('F',4)}${toABC('G',4)}${toABC('A',4)}${toABC('B',4)}${toABC('C',5)}\nw: I II III IV V VI VII I\n`,
        {staffwidth:360, audio:true});

  {
    id:'silences-liaisons', title:'Silences, liaisons, points et triolets', duration:'6 min',
    summary:"Ce que veut dire une pause, un point après une note, un trait courbe ou un petit 3 au-dessus d'un groupe.",
    render(){ return `
      <p>Au-delà des figures de note vues plus tôt, quelques signes complètent le vocabulaire rythmique : les silences, qui notent l'absence de son, et quelques symboles qui modifient ou regroupent des durées.</p>
      <h3>Les silences</h3>
      <p>À chaque figure de note correspond un silence de même durée, avec son propre nom :</p>
      <div class="figure-wrap">
        <table class="durations">
          <tr><th>Silence</th><th>Nom</th><th>Équivaut à</th></tr>
          <tr><td><div class="abc-notation dur-cell" id="rest-whole"></div></td><td>Pause</td><td>la ronde</td></tr>
          <tr><td><div class="abc-notation dur-cell" id="rest-half"></div></td><td>Demi-pause</td><td>la blanche</td></tr>
          <tr><td><div class="abc-notation dur-cell" id="rest-quarter"></div></td><td>Soupir</td><td>la noire</td></tr>
          <tr><td><div class="abc-notation dur-cell" id="rest-eighth"></div></td><td>Demi-soupir</td><td>la croche</td></tr>
          <tr><td><div class="abc-notation dur-cell" id="rest-sixteenth"></div></td><td>Quart de soupir</td><td>la double-croche</td></tr>
        </table>
      </div>
      <h3>Le point</h3>
      <p>Un point placé juste après une note prolonge sa durée de la moitié de sa valeur initiale : une noire pointée dure donc 1 temps ½ — exactement l'équivalent d'une noire liée à une croche.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-dot"></div>
        <p class="figure-cap">Une noire, puis une noire pointée : la seconde dure une fois et demie plus longtemps.</p>
      </div>
      <div class="callout">Un <strong>double point</strong> (plus rare) ajoute encore la moitié du point précédent, soit ¾ de la valeur initiale en tout.</div>
      <h3>La liaison</h3>
      <p>Un trait courbe entre deux notes peut vouloir dire deux choses très différentes selon ce qu'il relie :</p>
      <ul>
        <li>entre <strong>deux notes de même hauteur</strong>, c'est une <strong>liaison de prolongation</strong> (ou « liaison tout court ») : on additionne les deux durées en un seul son continu, sans réattaquer la note.</li>
        <li>entre <strong>des notes de hauteurs différentes</strong>, c'est une <strong>liaison d'expression</strong> (un « legato ») : on joue les notes normalement, chacune avec sa propre attaque, mais enchaînées le plus doucement possible, sans coupure.</li>
      </ul>
      <div class="figure-wrap" style="display:flex; gap:30px; flex-wrap:wrap; justify-content:center;">
        <div style="text-align:center;"><div class="abc-notation" id="abc-tie"></div><p class="figure-cap">Liaison de prolongation : un seul son tenu.</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="abc-slur"></div><p class="figure-cap">Liaison d'expression (legato) : quatre attaques enchaînées.</p></div>
      </div>
      <h3>Le triolet</h3>
      <p>Un petit chiffre « 3 » au-dessus d'un groupe de notes indique un <strong>triolet</strong> : trois notes jouées dans le temps qu'en prendraient normalement deux de la même figure — la pulsation ne change pas, mais les trois notes du groupe se partagent équitablement cet espace.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-triplet"></div>
        <p class="figure-cap">Trois croches en triolet, jouées dans la durée d'une noire.</p>
      </div>
    `; },
    mount(){
      const durOpts = {staffwidth:110, scale:1.1, paddingleft:2, paddingright:2};
      renderABC('rest-whole', abcTune('treble', 'z'), durOpts);
      renderABC('rest-half', abcTune('treble', 'z/2'), durOpts);
      renderABC('rest-quarter', abcTune('treble', 'z/4'), durOpts);
      renderABC('rest-eighth', abcTune('treble', 'z/8'), durOpts);
      renderABC('rest-sixteenth', abcTune('treble', 'z/16'), durOpts);
      const b = toABC('B',4);
      renderABC('abc-dot', `X:1\nL:1/4\nK:C clef=treble\n${b} ${b}3/2\n`, {staffwidth:200});
      renderABC('abc-tie', `X:1\nL:1/4\nK:C clef=treble\n${b}-${b}\n`, {staffwidth:160});
      renderABC('abc-slur', `X:1\nL:1/4\nK:C clef=treble\n(${toABC('C',4)}${toABC('D',4)}${toABC('E',4)}${toABC('F',4)})\n`, {staffwidth:260});
      renderABC('abc-triplet', `X:1\nL:1/8\nK:C clef=treble\n(3${toABC('C',4)}${toABC('D',4)}${toABC('E',4)}\n`, {staffwidth:160});
    }
  },
  {
    id:'signes-reprise', title:'Les signes de reprise', duration:'5 min',
    summary:"Barres de reprise, première et deuxième fins, D.C., D.S., Fine et Coda : comment une partition évite de tout réécrire.",
    render(){ return `
      <p>Plutôt que de réécrire deux fois un même passage, la musique utilise des <strong>signes de reprise</strong> : le musicien continue de lire la partition normalement, mais on lui indique par un symbole de revenir en arrière, ou de sauter directement à un autre endroit.</p>
      <h3>Les barres de reprise</h3>
      <p>Une double barre surmontée de deux points, ouvrant (<strong>|:</strong>) puis fermant (<strong>:|</strong>) un passage, signifie qu'il faut jouer ce passage deux fois avant de continuer.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-repeat"></div>
        <p class="figure-cap">Le passage entre les deux barres de reprise se joue deux fois de suite.</p>
      </div>
      <h3>Première et deuxième fins</h3>
      <p>Quand la fin d'un passage répété doit être légèrement différente la seconde fois, on place deux crochets numérotés « 1. » et « 2. » : à la première lecture, on joue la mesure sous le crochet 1 puis on repart au début ; à la seconde lecture, on saute directement la mesure du crochet 1 pour jouer celle du crochet 2.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-volta"></div>
        <p class="figure-cap">Première écoute : ...fa mi, puis retour au début. Seconde écoute : le crochet 1 est sauté, on va directement à la mesure du crochet 2.</p>
      </div>
      <h3>Segno, Coda, et les abréviations italiennes</h3>
      <div class="figure-wrap" style="display:flex; gap:30px; flex-wrap:wrap; justify-content:center;">
        <div style="text-align:center;"><div class="abc-notation" id="abc-segno"></div><p class="figure-cap">Segno</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="abc-coda"></div><p class="figure-cap">Coda</p></div>
      </div>
      <div class="figure-wrap">
        <table class="durations">
          <tr><th>Abréviation</th><th>Signification littérale</th><th>Ce que ça indique</th></tr>
          <tr><td>D.C. (Da Capo)</td><td>« depuis le début »</td><td>revenir tout au début du morceau</td></tr>
          <tr><td>D.S. (Dal Segno)</td><td>« depuis le signe »</td><td>revenir au symbole du segno</td></tr>
          <tr><td>al Fine</td><td>« jusqu'à la fin »</td><td>s'arrêter au mot « Fine »</td></tr>
          <tr><td>al Coda</td><td>« jusqu'à la coda »</td><td>sauter directement à la section Coda</td></tr>
        </table>
      </div>
      <div class="callout">Ces indications se combinent : « <strong>D.S. al Coda</strong> » veut dire « reviens au signe, joue jusqu'au symbole Coda, puis saute à la section Coda » — une façon très compacte de structurer un morceau sans réécrire des pages entières.</div>
    `; },
    mount(){
      renderABC('abc-repeat', `X:1\nL:1/4\nK:C clef=treble\n|: ${toABC('C',4)}${toABC('D',4)}${toABC('E',4)}${toABC('F',4)} | ${toABC('G',4)}${toABC('A',4)}${toABC('B',4)}${toABC('C',5)} :|\n`, {staffwidth:340});
      renderABC('abc-volta', `X:1\nL:1/4\nK:C clef=treble\n|: ${toABC('C',4)}${toABC('D',4)}${toABC('E',4)}${toABC('F',4)} |[1 ${toABC('G',4)}2 ${toABC('F',4)}2 :|[2 ${toABC('G',4)}4 |]\n`, {staffwidth:340});
      renderABC('abc-segno', abcTune('treble', '!segno!'+toABC('G',4)), {staffwidth:140});
      renderABC('abc-coda', abcTune('treble', '!coda!'+toABC('G',4)), {staffwidth:140});
    }

  {
    id:'modes-grecs', title:'Les modes grecs', duration:'6 min',
    summary:"Sept couleurs différentes obtenues en jouant les touches blanches à partir d'une note différente à chaque fois.",
    render(){ return `
      <p>Un <strong>mode</strong> s'obtient en jouant la même série de touches blanches, mais en changeant la note de départ (et donc d'arrivée) : la succession de tons et de demi-tons n'est plus la même, ce qui donne à chaque mode une couleur particulière, tout en restant dans les sept notes déjà connues. Deux de ces modes ne sont autres que les gammes majeure et mineure naturelle déjà étudiées.</p>
      <div class="figure-wrap">
        <table class="durations">
          <tr><th>Mode</th><th>Part de</th><th>Caractère</th></tr>
          <tr><td>Ionien</td><td>Do</td><td>= la gamme majeure, lumineuse et stable</td></tr>
          <tr><td>Dorien</td><td>Ré</td><td>mineur, mais avec une 6<sup>te</sup> majeure qui l'éclaircit — couleur jazz et musiques traditionnelles</td></tr>
          <tr><td>Phrygien</td><td>Mi</td><td>mineur avec une 2<sup>de</sup> mineure marquée — couleur andalouse, flamenco</td></tr>
          <tr><td>Lydien</td><td>Fa</td><td>majeur avec une 4<sup>te</sup> augmentée — flottant, rêveur</td></tr>
          <tr><td>Mixolydien</td><td>Sol</td><td>majeur avec une 7<sup>me</sup> mineure — couleur blues, rock</td></tr>
          <tr><td>Éolien</td><td>La</td><td>= la gamme mineure naturelle</td></tr>
          <tr><td>Locrien</td><td>Si</td><td>très instable (quinte diminuée sur la tonique) — presque jamais utilisé comme base d'un morceau entier</td></tr>
        </table>
      </div>
      <div class="figure-wrap" id="modes-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:18px;">
        <div style="text-align:center;"><div class="abc-notation" id="mode-ionien"></div><p class="figure-cap">Ionien (Do)</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="mode-dorien"></div><p class="figure-cap">Dorien (Ré)</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="mode-phrygien"></div><p class="figure-cap">Phrygien (Mi)</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="mode-lydien"></div><p class="figure-cap">Lydien (Fa)</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="mode-mixolydien"></div><p class="figure-cap">Mixolydien (Sol)</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="mode-eolien"></div><p class="figure-cap">Éolien (La)</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="mode-locrien"></div><p class="figure-cap">Locrien (Si)</p></div>
      </div>
      <div class="callout">Toutes les touches jouées restent blanches : ce qui change d'un mode à l'autre, c'est uniquement la place de la tonique — exactement comme pour la relative mineure, mais appliqué à sept points de départ possibles au lieu de deux.</div>
    `; },
    mount(){
      const opts = {staffwidth:150, scale:1, audio:true};
      const run = (start,startOct)=>{
        const order = ['C','D','E','F','G','A','B'];
        let i = order.indexOf(start);
        let oct = startOct, out=[];
        for (let k=0;k<8;k++){
          out.push(toABC(order[i], oct));
          i++; if (i===7){ i=0; oct++; }

        return out.join('');
      };
      renderABC('mode-ionien', abcTune('treble', run('C',4)), opts);
      renderABC('mode-dorien', abcTune('treble', run('D',4)), opts);
      renderABC('mode-phrygien', abcTune('treble', run('E',4)), opts);
      renderABC('mode-lydien', abcTune('treble', run('F',4)), opts);
      renderABC('mode-mixolydien', abcTune('treble', run('G',4)), opts);
      renderABC('mode-eolien', abcTune('treble', run('A',4)), opts);
      renderABC('mode-locrien', abcTune('treble', run('B',4)), opts);
    }
  },
  {
    id:'accords-septieme', title:'Les accords de septième', duration:'5 min',
    summary:"Empiler une troisième tierce sur une triade pour obtenir un accord de septième — et comprendre pourquoi le septième de dominante est si central.",
    render(){ return `
      <p>En empilant une tierce de plus au-dessus d'une triade (fondamentale, tierce, quinte), on obtient un <strong>accord de septième</strong> : quatre notes, plus riche et plus coloré qu'un accord parfait. Trois versions reviennent particulièrement souvent.</p>
      <h3>Septième majeure</h3>
      <p>Triade majeure + une 7<sup>me</sup> majeure au-dessus de la fondamentale : Do Mi Sol Si (Do majeur 7). Sonorité douce, un peu rêveuse — très utilisée en jazz et en musique de film.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-maj7"></div><p class="figure-cap">Do majeur 7 : Do – Mi – Sol – Si.</p></div>
      <h3>Septième de dominante</h3>
      <p>Triade majeure + une 7<sup>me</sup> mineure : Sol Si Ré Fa (Sol 7). C'est l'accord construit sur le 5<sup>e</sup> degré (la dominante) d'une tonalité, et il contient à la fois la sensible et cette 7<sup>me</sup> mineure — une tension à deux notes qui veut presque physiquement se résoudre sur l'accord de tonique. La cadence <strong>V7 → I</strong> (ici Sol7 → Do majeur) est l'une des progressions les plus fondamentales de toute la musique tonale.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-dom7"></div><p class="figure-cap">Sol 7 (dominante de Do majeur) : Sol – Si – Ré – Fa.</p></div>
      <h3>Septième mineure</h3>
      <p>Triade mineure + une 7<sup>me</sup> mineure : La Do Mi Sol (La mineur 7). Plus doux qu'une triade mineure seule, très courant en jazz et en pop.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-min7"></div><p class="figure-cap">La mineur 7 : La – Do – Mi – Sol.</p></div>
      <div class="callout">Il existe aussi des accords de septième diminuée et demi-diminuée, plus instables encore, utilisés surtout comme accords de passage — une fois ces trois-là bien reconnus à l'oreille, ils s'apprivoisent facilement par comparaison.</div>
    `; },
    mount(){
      renderABC('abc-maj7', abcTune('treble', `[${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}${toABC('B',4)}]`), {staffwidth:200, audio:true});
      renderABC('abc-dom7', abcTune('treble', `[${toABC('G',4)}${toABC('B',4)}${toABC('D',5)}${toABC('F',5)}]`), {staffwidth:200, audio:true});
      renderABC('abc-min7', abcTune('treble', `[${toABC('A',3)}${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}]`), {staffwidth:200, audio:true});
    }
  },
  {
    id:'transposition', title:'La transposition', duration:'4 min',
    summary:"Déplacer un morceau dans une autre tonalité en conservant exactement les mêmes intervalles entre les notes.",
    render(){ return `
      <p><strong>Transposer</strong>, c'est déplacer toutes les notes d'un morceau d'un même intervalle, vers le haut ou vers le bas : chaque relation entre les notes (chaque intervalle) reste identique, seule la tonalité de départ change.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-transpose-before"></div>
        <p class="figure-cap">Un motif en Do majeur : Do Ré Mi Do.</p>
      </div>
      <div class="figure-wrap"><div class="abc-notation" id="abc-transpose-after"></div>
        <p class="figure-cap">Le même motif transposé une seconde majeure plus haut, en Ré majeur : Ré Mi Fa♯ Ré — même dessin mélodique, deux tons plus haut, et un Fa♯ apparu pour préserver exactement les mêmes intervalles.</p>
      </div>
      <p>Concrètement, transposer demande deux choses : décaler chaque note du même intervalle, et recalculer l'armure de la nouvelle tonalité pour que les intervalles d'origine soient bien conservés (ici, Do majeur n'avait aucune altération ; Ré majeur, lui, en a deux).</p>
      <h3>À quoi ça sert ?</h3>
      <ul>
        <li>adapter un morceau à la tessiture d'un chanteur, sans changer la mélodie elle-même ;</li>
        <li>jouer un même morceau plus haut ou plus bas pour l'adapter à un instrument, ou pour le rendre plus facile à exécuter ;</li>
        <li>écrire pour un <strong>instrument transpositeur</strong> — une clarinette ou une trompette « en Sib », par exemple, dont la note écrite « Do » sonne en réalité un ton plus bas : le musicien lit toujours en Do majeur, mais le morceau sonne pour tout le monde en Sib majeur.</li>
      </ul>
      <div class="callout">Le cercle des quintes, vu plus tôt, est un excellent repère pour transposer : décaler d'une position sur le cercle revient à transposer d'une quinte, en ajoutant ou retirant une seule altération à l'armure.</div>
    `; },
    mount(){
      renderABC('abc-transpose-before', abcTune('treble', toABC('C',4)+toABC('D',4)+toABC('E',4)+toABC('C',4), 'C'), {staffwidth:260, audio:true});
      renderABC('abc-transpose-after', abcTune('treble', toABC('D',4)+toABC('E',4)+toABC('F',4)+toABC('D',4), 'D'), {staffwidth:260, audio:true});
    }
  },
  {
    id:'harmonisation-degres', title:'Harmoniser les degrés de la gamme', duration:'6 min',
    summary:"Un accord différent — majeur, mineur ou diminué — naît naturellement sur chacun des sept degrés d'une gamme majeure.",
    render(){ return `
      <p>En empilant une triade (fondamentale, tierce, quinte) sur chaque degré d'une gamme majeure, en n'utilisant que les notes de cette gamme, on obtient sept accords — et leur nature (majeur, mineur, ou diminué) suit toujours exactement le même schéma, quelle que soit la tonalité.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-harmonisation"></div>
        <p class="figure-cap">Les sept accords de Do majeur, un par degré. Majuscule = accord majeur, minuscule = accord mineur, ° = accord diminué.</p>
      </div>
      <div class="figure-wrap">
        <table class="durations">
          <tr><th>Degré</th><th>Nom</th><th>Accord</th></tr>
          <tr><td>I</td><td>Tonique</td><td>Majeur</td></tr>
          <tr><td>ii</td><td>Sus-tonique</td><td>Mineur</td></tr>
          <tr><td>iii</td><td>Médiante</td><td>Mineur</td></tr>
          <tr><td>IV</td><td>Sous-dominante</td><td>Majeur</td></tr>
          <tr><td>V</td><td>Dominante</td><td>Majeur</td></tr>
          <tr><td>vi</td><td>Sus-dominante</td><td>Mineur</td></tr>
          <tr><td>vii°</td><td>Sensible</td><td>Diminué</td></tr>
        </table>
      </div>
      <div class="callout">Ce schéma — Majeur, mineur, mineur, Majeur, Majeur, mineur, diminué — est <strong>le même pour toutes les tonalités majeures</strong> : c'est exactement ce que la leçon sur la transposition permet de déplacer d'une tonalité à l'autre sans rien recalculer.</div>
      <p>Le seul accord diminué de la gamme se trouve toujours sur la sensible (vii°) : sa quinte diminuée (une quinte réduite d'un demi-ton) le rend instable, ce qui renforce encore l'appel vers la tonique déjà présent dans la sensible elle-même.</p>
    `; },

      renderABC('abc-harmonisation',
        `X:1\nL:1/4\nK:C clef=treble\n[${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}][${toABC('D',4)}${toABC('F',4)}${toABC('A',4)}][${toABC('E',4)}${toABC('G',4)}${toABC('B',4)}][${toABC('F',4)}${toABC('A',4)}${toABC('C',5)}][${toABC('G',4)}${toABC('B',4)}${toABC('D',5)}][${toABC('A',4)}${toABC('C',5)}${toABC('E',5)}][${toABC('B',4)}${toABC('D',5)}${toABC('F',5)}]\nw: I ii iii IV V vi vii°\n`,
        {staffwidth:380, audio:true});

  {
    id:'substitution-accords', title:"Les substitutions d'accords", duration:'5 min',
    summary:"Remplacer un accord par un autre qui partage sa fonction ou ses notes, sans dénaturer l'harmonie.",
    render(){ return `
      <p>Deux accords qui partagent plusieurs notes, ou qui jouent le même rôle dans une progression, peuvent souvent se remplacer l'un par l'autre : c'est la <strong>substitution d'accords</strong>, un outil très employé en arrangement et en improvisation.</p>
      <h3>Trois familles de fonction</h3>
      <p>Les sept accords d'une gamme se regroupent en trois familles, selon leur degré de tension par rapport à la tonique :</p>
      <ul>
        <li><strong>Fonction tonique</strong> (repos) : I, vi, iii</li>
        <li><strong>Fonction sous-dominante</strong> (tension légère) : IV, ii</li>
        <li><strong>Fonction dominante</strong> (forte tension, veut résoudre) : V, vii°</li>
      </ul>
      <p>Deux accords d'une même famille se substituent généralement bien, car ils remplissent le même rôle dans la progression harmonique.</p>
      <h3>La substitution relative</h3>
      <p>L'exemple le plus courant : remplacer l'accord de tonique (I) par sa relative mineure (vi). En Do majeur, Do majeur (Do-Mi-Sol) et La mineur (La-Do-Mi) partagent deux notes sur trois (Do et Mi) — le résultat garde la même fonction de repos, avec une couleur légèrement plus sombre.</p>
      <div class="figure-wrap" style="display:flex; gap:30px; flex-wrap:wrap; justify-content:center;">
        <div style="text-align:center;"><div class="abc-notation" id="abc-sub-i"></div><p class="figure-cap">I : Do majeur</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="abc-sub-vi"></div><p class="figure-cap">vi : La mineur — deux notes communes</p></div>
      </div>
      <h3>La substitution tritonique (pour aller plus loin)</h3>
      <p>En jazz, on remplace parfois un accord de septième de dominante par un autre accord de septième de dominante dont la fondamentale est à un triton (trois tons, soit six demi-tons) de distance. Les deux accords partagent alors leur tierce et leur septième (simplement échangées), ce qui préserve l'essentiel de la tension tout en créant une basse chromatique.</p>
      <div class="figure-wrap" style="display:flex; gap:30px; flex-wrap:wrap; justify-content:center;">
        <div style="text-align:center;"><div class="abc-notation" id="abc-sub-g7"></div><p class="figure-cap">Sol 7</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="abc-sub-db7"></div><p class="figure-cap">Réb 7 — à un triton de Sol</p></div>
      </div>
    `; },
    mount(){
      renderABC('abc-sub-i', abcTune('treble', `[${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}]`), {staffwidth:150, audio:true});
      renderABC('abc-sub-vi', abcTune('treble', `[${toABC('A',3)}${toABC('C',4)}${toABC('E',4)}]`), {staffwidth:150, audio:true});
      renderABC('abc-sub-g7', abcTune('treble', `[${toABC('G',4)}${toABC('B',4)}${toABC('D',5)}${toABC('F',5)}]`), {staffwidth:150, audio:true});
      renderABC('abc-sub-db7', abcTune('treble', `[${toABC('D',4,'_')}${toABC('F',4)}${toABC('A',4,'_')}${toABC('C',5,'_')}]`), {staffwidth:150, audio:true});
    }
  },
  {
    id:'basse-chiffree', title:'La basse chiffrée', duration:'5 min',
    summary:"Une notation baroque compacte : la ligne de basse, accompagnée de chiffres qui indiquent l'accord à construire au-dessus.",
    render(){ return `
      <p>Avant les grilles d'accords modernes, les musiciens baroques utilisaient la <strong>basse chiffrée</strong> (ou « basse continue ») : on n'écrivait que la ligne de basse, accompagnée de petits chiffres indiquant les intervalles à jouer au-dessus pour compléter l'accord. Le musicien à l'orgue ou au clavecin improvisait le reste.</p>
      <h3>Position fondamentale</h3>
      <p>Quand la fondamentale de l'accord est à la basse, les chiffres seraient « 5 3 » (une quinte et une tierce au-dessus de la basse) — mais c'est la situation par défaut, donc on l'omet presque toujours : une basse sans aucun chiffre indique une triade en position fondamentale.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-bc-root"></div>
        <p class="figure-cap">Do en position fondamentale : Do à la basse, aucun chiffre nécessaire.</p>
      </div>
      <h3>Premier renversement — le chiffre « 6 »</h3>
      <p>Quand c'est la tierce de l'accord qui se trouve à la basse, les intervalles au-dessus deviennent une sixte et une tierce ; on ne note que le plus caractéristique des deux, le <strong>6</strong>.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-bc-6"></div>
        <p class="figure-cap">Mi à la basse, chiffré 6 : toujours l'accord de Do majeur, mais renversé.</p>
      </div>
      <h3>Second renversement — le chiffre « 6/4 »</h3>
      <p>Quand c'est la quinte qui se trouve à la basse, les intervalles au-dessus sont une sixte et une quarte : on chiffre <strong>6/4</strong>.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-bc-64"></div>
        <p class="figure-cap">Sol à la basse, chiffré 6/4 : encore Do majeur, dans sa position la plus renversée.</p>
      </div>
      <div class="callout">Le chiffre <strong>7</strong> tout seul indique un accord de septième en position fondamentale (septième, quinte et tierce empilées sur la basse) — la logique reste la même, simplement avec une note de plus à empiler.</div>
      <p>La basse chiffrée décrit donc exactement les <strong>renversements</strong> déjà vus indirectement dans la leçon sur les accords : une même triade, jouée avec des notes différentes à la basse.</p>
    `; },
    mount(){
      renderABC('abc-bc-root', abcTune('treble', `[${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}]`), {staffwidth:150, audio:true});
      renderABC('abc-bc-6', abcTune('treble', `[${toABC('E',4)}${toABC('G',4)}${toABC('C',5)}]`), {staffwidth:150, audio:true});
      renderABC('abc-bc-64', abcTune('treble', `[${toABC('G',4)}${toABC('C',5)}${toABC('E',5)}]`), {staffwidth:150, audio:true});
    }
  },
  {
    id:'cadences', title:'Les cadences', duration:'5 min',
    summary:"Quatre façons de conclure — ou de suspendre — une phrase musicale avec un enchaînement de deux accords.",
    render(){ return `
      <p>Une <strong>cadence</strong> est un court enchaînement de deux accords qui ponctue la fin d'une phrase musicale — un peu comme un signe de ponctuation. Selon les accords utilisés, elle referme la phrase avec plus ou moins de certitude, ou la laisse volontairement en suspens.</p>
      <h3>Cadence parfaite : V → I</h3>
      <p>L'accord de dominante suivi de l'accord de tonique, tous deux en position fondamentale. C'est la conclusion la plus stable et la plus franche — celle qu'on entend à la toute fin de la grande majorité des morceaux tonals.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-cad-parfaite"></div></div>
      <h3>Cadence plagale : IV → I</h3>
      <p>Plus douce que la parfaite, souvent appelée « cadence d'Amen » car c'est elle qu'on entend traditionnellement sur ce mot à la fin des hymnes religieux.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-cad-plagale"></div></div>
      <h3>Cadence imparfaite (ou demi-cadence) : ... → V</h3>
      <p>N'importe quel enchaînement qui s'arrête <em>sur</em> l'accord de dominante, sans revenir à la tonique. Le morceau semble suspendu, en attente d'une suite — souvent utilisée au milieu d'une phrase plutôt qu'à sa toute fin.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-cad-imparfaite"></div></div>
      <h3>Cadence rompue : V → vi</h3>
      <p>L'oreille attend une résolution vers la tonique (I) après la dominante, mais la musique part vers la relative mineure (vi) à la place — une petite surprise, souvent utilisée pour prolonger une phrase plus longtemps que prévu.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-cad-rompue"></div></div>
      <div class="callout">Repérer une cadence, c'est repérer où l'oreille « respire » dans un morceau — un repère précieux pour comprendre sa structure, juste avant la leçon sur la forme musicale.</div>
    `; },
    mount(){
      const opts = {staffwidth:200, scale:1.1, audio:true};
      renderABC('abc-cad-parfaite', abcTune('treble', `[${toABC('G',4)}${toABC('B',4)}${toABC('D',5)}][${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}]`), opts);
      renderABC('abc-cad-plagale', abcTune('treble', `[${toABC('F',4)}${toABC('A',4)}${toABC('C',5)}][${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}]`), opts);
      renderABC('abc-cad-imparfaite', abcTune('treble', `[${toABC('C',4)}${toABC('E',4)}${toABC('G',4)}][${toABC('G',4)}${toABC('B',4)}${toABC('D',5)}]`), opts);
      renderABC('abc-cad-rompue', abcTune('treble', `[${toABC('G',4)}${toABC('B',4)}${toABC('D',5)}][${toABC('A',4)}${toABC('C',5)}${toABC('E',5)}]`), opts);
    }
  },
  {
    id:'ornements', title:'Les ornements', duration:'5 min',
    summary:"Trille, appoggiature, mordant : de petites notes ajoutées qui décorent une mélodie sans en changer le fond.",
    render(){ return `
      <p>Un <strong>ornement</strong> décore une note sans changer l'identité de la mélodie : une fois enlevé, la ligne mélodique reste parfaitement cohérente. Trois ornements reviennent le plus souvent.</p>
      <div class="figure-wrap" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:18px;">
        <div style="text-align:center;"><div class="abc-notation" id="orn-trille"></div><p class="figure-cap">Trille</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="orn-appog"></div><p class="figure-cap">Appoggiature</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="orn-mordant"></div><p class="figure-cap">Mordant</p></div>
        <div style="text-align:center;"><div class="abc-notation" id="orn-mordant-sup"></div><p class="figure-cap">Mordant supérieur</p></div>
      </div>
      <h3>Le trille</h3>
      <p>Une alternance rapide et répétée entre la note écrite et la note juste au-dessus, du début à la fin de sa durée. Noté « tr » ou par une petite vague au-dessus de la note.</p>
      <h3>L'appoggiature</h3>
      <p>Une petite note « d'appui », placée juste avant la note principale et notée en plus petit : elle prend une partie du temps de la note principale avant de se résoudre sur elle, créant une légère tension suivie de sa détente.</p>
      <h3>Le mordant</h3>
      <p>Une alternance unique et très rapide entre la note principale et sa voisine — la note du dessous pour un mordant simple, celle du dessus pour un <strong>mordant supérieur</strong> (parfois appelé « pincé »). Contrairement au trille, il ne se répète pas : un seul aller-retour, quasi instantané.</p>
    `; },
    mount(){
      const opts = {staffwidth:130, scale:1.1, audio:true};
      renderABC('orn-trille', abcTune('treble', '!trill!'+toABC('G',4)), opts);
      renderABC('orn-appog', abcTune('treble', `{${toABC('A',4)}}${toABC('G',4)}`), opts);
      renderABC('orn-mordant', abcTune('treble', '!mordent!'+toABC('G',4)), opts);
      renderABC('orn-mordant-sup', abcTune('treble', '!pralltriller!'+toABC('G',4)), opts);
    }
  },
  {
    id:'chromatisme', title:'Le chromatisme et les notes de passage', duration:'5 min',
    summary:"La gamme chromatique (les douze demi-tons), et comment de courtes notes étrangères à l'accord relient les notes d'une mélodie.",
    render(){ return `
      <p>Jusqu'ici, les gammes étudiées avançaient par tons et demi-tons dans un ordre précis. La <strong>gamme chromatique</strong>, elle, ne contient que des demi-tons : elle englobe les douze notes de l'octave, touches noires comprises.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-chromatique"></div>
        <p class="figure-cap">La gamme chromatique ascendante depuis Do — douze demi-tons, aucun ton entier.</p>
      </div>
      <h3>Les notes de passage</h3>
      <p>Une mélodie ne se limite pas aux notes de l'accord qui l'accompagne : de courtes <strong>notes étrangères</strong>, non comprises dans cet accord, viennent souvent relier deux notes qui en font partie, par mouvement conjoint (degré par degré).</p>
      <p>La plus courante est la <strong>note de passage</strong> : elle comble l'espace d'une tierce entre deux notes de l'accord. Sur un accord de Do majeur (Do-Mi-Sol), un Ré entre le Do et le Mi n'appartient pas à l'accord, mais relie les deux naturellement.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-passage"></div>
        <p class="figure-cap">Do (accord) — Ré (note de passage) — Mi (accord).</p>
      </div>
      <p>Une variante, la <strong>note voisine</strong> (ou broderie), part d'une note de l'accord, s'écarte d'un degré, puis revient immédiatement sur la même note de départ plutôt que de continuer vers une autre note de l'accord.</p>
      <div class="figure-wrap"><div class="abc-notation" id="abc-voisine"></div>
        <p class="figure-cap">Do — Ré (note voisine) — Do : on revient sur place.</p>
      </div>
      <div class="callout">Ces notes étrangères à l'accord n'ont rien d'une « erreur » : elles font partie du langage mélodique normal, et c'est souvent leur présence qui rend une mélodie chantante plutôt que de sonner comme une simple récitation des notes de l'accord.</div>
    `; },
    mount(){
      renderABC('abc-chromatique',
        `X:1\nL:1/8\nK:C clef=treble\n${toABC('C',4)}${toABC('C',4,'^')}${toABC('D',4)}${toABC('D',4,'^')}${toABC('E',4)}${toABC('F',4)}${toABC('F',4,'^')}${toABC('G',4)}${toABC('G',4,'^')}${toABC('A',4)}${toABC('A',4,'^')}${toABC('B',4)}${toABC('C',5)}\n`,
        {staffwidth:400, audio:true});
      renderABC('abc-passage', abcTune('treble', toABC('C',4)+toABC('D',4)+toABC('E',4)), {staffwidth:200, audio:true});
      renderABC('abc-voisine', abcTune('treble', toABC('C',4)+toABC('D',4)+toABC('C',4)), {staffwidth:200, audio:true});
    }
  },
  {
    id:'forme-musicale', title:'La forme musicale', duration:'5 min',
    summary:"Comment un morceau s'organise en grandes sections : forme binaire, ternaire, ou thème et variations.",
    render(){ return `
      <p>Au-delà de la note, de la mesure ou de la phrase, un morceau tout entier a une <strong>forme</strong> — une organisation en grandes sections qui structurent l'écoute, un peu comme les paragraphes d'un texte.</p>
      <h3>Forme binaire (A B)</h3>
      <p>Deux sections contrastées, l'une après l'autre, sans retour à la première. Chaque section peut elle-même être répétée (souvent notée A A B B grâce aux barres de reprise déjà vues) sans que cela change la logique en deux blocs.</p>
      <div class="figure-wrap"><div class="form-diagram"><div class="form-block form-a">A</div><div class="form-block form-b">B</div></div></div>
      <h3>Forme ternaire (A B A)</h3>
      <p>Une troisième section reprend la première (à l'identique ou presque) après la section contrastante B — c'est exactement le principe déjà rencontré avec les barres de reprise et le « <strong>D.C. al Fine</strong> » : revenir jouer A une seconde fois après B. Un menuet avec trio suit typiquement cette forme.</p>
      <div class="figure-wrap"><div class="form-diagram"><div class="form-block form-a">A</div><div class="form-block form-b">B</div><div class="form-block form-a">A</div></div></div>
      <h3>Thème et variations</h3>
      <p>Un thème (une mélodie complète, généralement simple et mémorisable) est présenté une première fois, puis repris plusieurs fois de suite en étant à chaque fois transformé — changement de rythme, d'ornementation, d'harmonie, ou même de mode (majeur devenant mineur) — tout en restant reconnaissable sous la transformation.</p>
      <div class="figure-wrap"><div class="form-diagram">

/* ======================================================================
   RENDU MUSICAL — abcjs
   abcjs fait le travail de gravure (clés, altérations, ligatures, portée) ;
   on ne fait plus que construire de petites chaînes en notation ABC et le
   laisser dessiner. Couleurs suivies via CSS (voir règle .abc-notation svg *).
====================================================================== */
// Convertit une note (lettre + octave scientifique, ex. 'G',4) en pitch ABC.
// Convention ABC standard : minuscule = octave de Do central (c=Do4) ; apostrophe(s) montent d'autant
// d'octaves ; MAJUSCULE = octave en dessous (C=Do3) ; virgule(s) descendent d'autant d'octaves.
function toABC(letter, octave, accidental){
  accidental = accidental || ''; // '^' dièse, '_' bémol, '=' bécarre
  if (octave >= 4){
    return accidental + letter.toLowerCase() + "'".repeat(octave-4);
  }
  return accidental + letter.toUpperCase() + ','.repeat(3-octave);
}
// Construit une mini-partition ABC prête à afficher : une portée avec une clé (et,
// optionnellement, une armure via keySuffix, ex. " ♯F♯" -> on passe plutôt le nom abc, ex. 'G').
function abcTune(clef, notesABC, key){
  key = key || 'C';
  return `X:1\nL:1\nK:${key} clef=${clef}\n${notesABC}\n`;
}
// Rend une chaîne ABC dans le conteneur donné (vide le conteneur d'abord pour ne pas empiler
// les rendus successifs, utile pour les jeux qui regénèrent une note à chaque manche).
// opts.audio = true ajoute un bouton "Écouter" qui rejoue la figure via le vrai synthétiseur d'abcjs.
function renderABC(containerId, abcString, opts){
  const el = document.getElementById(containerId);
  if (!el || typeof ABCJS === 'undefined') return null;
  el.innerHTML = '';
  const finalOpts = Object.assign({add_classes:true, staffwidth:340, scale:1, paddingtop:0, paddingbottom:0, paddingleft:4, paddingright:4, responsive:'resize'}, opts||{});
  const tunes = ABCJS.renderAbc(containerId, abcString, finalOpts);
  const tune = tunes && tunes[0];
  if (finalOpts.audio) addPlayButton(containerId, tune);
  return tune;
}
let _sharedAudioCtx = null;
function getSharedAudioCtx(){
  _sharedAudioCtx = _sharedAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
  return _sharedAudioCtx;
}
// Ajoute un bouton "Écouter" sous une figure abcjs, utilisant le vrai module audio d'abcjs
// (ABCJS.synth.CreateSynth), qui rejoue les véritables échantillons sonores de la soundfont.
function addPlayButton(containerId, visualObj){
  if (!visualObj || typeof ABCJS === 'undefined' || !ABCJS.synth || !ABCJS.synth.supportsAudio || !ABCJS.synth.supportsAudio()) return;
  const host = document.getElementById(containerId);
  if (!host) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'abc-play-btn';
  btn.textContent = '▶ Écouter';
  host.appendChild(btn);
  let synth = null;
  btn.addEventListener('click', async ()=>{
    btn.disabled = true;
    try{
      const ctx = getSharedAudioCtx();
      if (ctx.state === 'suspended') await ctx.resume();
      if (!synth){
        synth = new ABCJS.synth.CreateSynth();
        await synth.init({ audioContext: ctx, visualObj });
        await synth.prime();
      }
      btn.textContent = '♪ lecture…';
      synth.start();
      const ms = Math.max(700, (synth.duration || 1.2) * 1000 + 150);
      setTimeout(()=>{ btn.disabled = false; btn.textContent = '▶ Réécouter'; }, ms);
    }catch(e){
      btn.textContent = '⚠ Audio indisponible ici';
      btn.disabled = true;
      console.warn('abcjs audio unavailable:', e);
    }
  });
}
function miniKeyboardSVG(){

  const whites = 7; const w = 400/whites;

}
// One full octave (Do to Do), white keys only, with the T / ST interval between each pair labelled —
// used to make the major-scale formula visible directly on the keyboard.
function scaleToneKeyboardSVG(){
  const whites = 8; const w = 400/whites;
  const names = ['Do','Ré','Mi','Fa','Sol','La','Si','Do'];
  const intervals = ['T','T','ST','T','T','T','ST'];
  let s='';
  for (let i=0;i<whites;i++){
    s += `<rect x="${i*w}" y="26" width="${w-1}" height="90" fill="#FFFDF7" stroke="#1B2440" stroke-width="1"/>`;
    s += `<text x="${i*w + w/2}" y="104" text-anchor="middle" font-size="13" font-weight="600" font-family="Inter, sans-serif" fill="#4C5A82">${names[i]}</text>`;
  }
  const blackPos = [0,1,3,4,5,6]; const bw = w*0.58;
  blackPos.forEach(i=>{ if(i<whites-1) s += `<rect x="${(i+1)*w - bw/2}" y="26" width="${bw}" height="56" fill="#181818"/>`; });
  for (let i=0;i<whites-1;i++){
    const cx = (i+1)*w;
    const isST = intervals[i]==='ST';
    s += `<text x="${cx}" y="16" text-anchor="middle" font-size="13" font-weight="700" font-family="'Fraunces',serif" fill="${isST?'#B14A3D':'#8C6D1F'}">${intervals[i]}</text>`;
    s += `<line x1="${cx}" y1="20" x2="${cx}" y2="26" stroke="${isST?'#B14A3D':'#8C6D1F'}" stroke-width="2"/>`;
  }
  return s;
}
// Circle of fifths: 12 major keys arranged clockwise by ascending sharps, counter-clockwise by ascending flats.
function circleOfFifthsSVG(){
  const labels   = ['Do','Sol','Ré','La','Mi','Si','Fa♯／Solb','Réb','Lab','Mib','Sib','Fa'];
  const accCount = ['0','1♯','2♯','3♯','4♯','5♯','6♯／6♭','5♭','4♭','3♭','2♭','1♭'];
  const cx=200, cy=200, R=148, r2=104;
  let s = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--rule-strong)" stroke-width="1"/>`;
  for (let i=0;i<12;i++){
    const angle = (i*30-90)*Math.PI/180;
    const x = cx+R*Math.cos(angle), y = cy+R*Math.sin(angle);
    const x2 = cx+r2*Math.cos(angle), y2 = cy+r2*Math.sin(angle);
    s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="'Fraunces',serif" font-weight="700" font-size="17" fill="var(--fg)">${labels[i]}</text>`;
    s += `<text x="${x2}" y="${y2}" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif" font-size="11" fill="var(--accent-deep)">${accCount[i]}</text>`;
  }
  return `<svg viewBox="0 0 400 400" width="100%" style="max-width:380px; display:block; margin:0 auto;">${s}</svg>`;
}

function hairpinSVG(kind){

}

  const sigs = [2,3,4,6];

  sigRow.innerHTML = sigs.map(n=>`<button class="chip ${n===4?'active':''}" data-n="${n}">${n}/4</button>`).join('');
  sigRow.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click', ()=>{

  const playBtn = document.getElementById('play-btn');
  const pendulum = document.getElementById('pendulum');
  let bpm = 100, playing = false, audioCtx=null, nextNoteTime=0, beatCount=0, timerId=null;

  bpmRange.addEventListener('input', ()=>{ bpm = parseInt(bpmRange.value,10); bpmVal.textContent = bpm; });

  function click(time, accent){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = accent ? 1400 : 900;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(accent?0.5:0.32, time+0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+0.06);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(time); osc.stop(time+0.07);
  }
  function scheduler(){
    while (nextNoteTime < audioCtx.currentTime + 0.12){
      const accent = beatCount % beatsPerMeasure === 0;
      click(nextNoteTime, accent);
      const t = nextNoteTime; const acc = accent;
      const delay = Math.max(0,(t - audioCtx.currentTime)*1000);
      setTimeout(()=>{ pendulum.style.transform = 'scale(' + (acc?1.5:1.15) + ')'; setTimeout(()=>pendulum.style.transform='scale(1)',90); }, delay);
      nextNoteTime += 60/bpm;
      beatCount++;
    }
    timerId = setTimeout(scheduler, 25);
  }
  playBtn.addEventListener('click', ()=>{
    playing = !playing;
    if (playing){
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      if (audioCtx.state==='suspended') audioCtx.resume();
      beatCount = 0; nextNoteTime = audioCtx.currentTime + 0.05;
      scheduler();
      playBtn.textContent = '■ Arrêter';
    } else {
      clearTimeout(timerId);
      playBtn.textContent = '▶ Démarrer';
    }
  });
  const tapBtn = document.getElementById('tap-btn');
  let taps = [];
  tapBtn.addEventListener('click', ()=>{
    const now = performance.now();
    taps = taps.filter(t=>now-t<2200);
    taps.push(now);
    if (taps.length>=2){
      const intervals = []; for(let i=1;i<taps.length;i++) intervals.push(taps[i]-taps[i-1]);
      const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
      bpm = Math.max(40,Math.min(220, Math.round(60000/avg)));
      bpmRange.value = bpm; bpmVal.textContent = bpm;
    }
  });
  return function cleanup(){ clearTimeout(timerId); if (audioCtx) audioCtx.close(); };
}

function autoCorrelate(buf, sampleRate){
  const SIZE = buf.length;
  let rms = 0;
  for (let i=0;i<SIZE;i++) rms += buf[i]*buf[i];
  rms = Math.sqrt(rms/SIZE);
  if (rms < 0.01) return -1;
  let r1=0, r2=SIZE-1; const thres=0.2;
  for (let i=0;i<SIZE/2;i++){ if (Math.abs(buf[i])<thres){ r1=i; break; } }
  for (let i=1;i<SIZE/2;i++){ if (Math.abs(buf[SIZE-i])<thres){ r2=SIZE-i; break; } }
  const trimmed = buf.slice(r1,r2);
  const n = trimmed.length;
  const c = new Array(n).fill(0);
  for (let lag=0; lag<n; lag++){
    let sum=0; for (let i=0;i<n-lag;i++) sum += trimmed[i]*trimmed[i+lag];
    c[lag]=sum;
  }
  let d=0; while (d<n-1 && c[d]>c[d+1]) d++;
  let maxval=-1, maxpos=-1;
  for (let i=d;i<n;i++){ if (c[i]>maxval){ maxval=c[i]; maxpos=i; } }
  let T0 = maxpos;
  if (T0>0 && T0<n-1){
    const x1=c[T0-1], x2=c[T0], x3=c[T0+1];
    const a=(x1+x3-2*x2)/2, b=(x3-x1)/2;
    if (a) T0 = T0 - b/(2*a);
  }
  return T0>0 ? sampleRate/T0 : -1;
}
const NOTE_NAMES_FR = ['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
function freqToNote(freq){
  const midi = 69 + 12*Math.log2(freq/440);
  const rounded = Math.round(midi);
  const cents = Math.round((midi-rounded)*100);
  const octave = Math.floor(rounded/12)-1;
  const name = NOTE_NAMES_FR[((rounded%12)+12)%12];
  return {name, octave, cents};
}

    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    const freq = autoCorrelate(buf, audioCtx.sampleRate);
    if (freq>0 && freq<2000){
      const {name, octave, cents} = freqToNote(freq);
      noteEl.textContent = name + octave;
      centsEl.textContent = (cents>0?'+':'')+cents+' cents · '+freq.toFixed(1)+' Hz';
      const pct = Math.max(-50,Math.min(50,cents));
      needle.style.left = (50 + pct) + '%';
      needle.style.background = Math.abs(cents)<=5 ? 'var(--sage)' : (Math.abs(cents)<=15 ? 'var(--accent-deep)' : 'var(--brick)');
    }
    rafId = requestAnimationFrame(loop);
  }
  micBtn.addEventListener('click', async ()=>{
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 2048;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      micBtn.style.display='none';
      centsEl.textContent = 'écoute en cours…';
      loop();
    }catch(e){
      centsEl.textContent = "Micro inaccessible — vérifiez les autorisations de votre navigateur.";
    }
  });
  return function cleanup(){
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(t=>t.stop());
    if (audioCtx) audioCtx.close();
  };
}

====================================================================== */
function renderPiano(){
  $view.innerHTML = `
    ${crumb('#/outils','Outils')}
    <div class="section-head"><h2>Piano virtuel</h2></div>
    <div class="tool-shell">
      <p>Cliquez, touchez, ou jouez au clavier : <b>A S D F G H J</b> pour les touches blanches, <b>W E T Y U</b> pour les noires.</p>
      <div class="tool-row">
        <button class="btn btn-ghost" id="oct-down">Octave −</button>
        <span class="bpm-label" style="align-self:center;" id="oct-label">Octave 4</span>
        <button class="btn btn-ghost" id="oct-up">Octave +</button>
      </div>
    </div>
    <div class="piano-wrap"><div class="piano" id="piano"></div></div>
  `;
  const whiteSeq = ['C','D','E','F','G','A','B'];
  const blackAfter = {C:'C♯',D:'D♯',F:'F♯',G:'G♯',A:'A♯'};
  const keyMapWhite = {a:'C',s:'D',d:'E',f:'F',g:'G',h:'A',j:'B'};
  const keyMapBlack = {w:'C',e:'D',t:'F',y:'G',u:'A'};
  let octave = 4;
  const pianoEl = document.getElementById('piano');
  const octLabel = document.getElementById('oct-label');
  let audioCtx = null;
  function ensureCtx(){ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
  function freqOf(letter, oct, sharp){
    const semis = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[letter] + (sharp?1:0);
    const midi = (oct+1)*12 + semis;
    return 440*Math.pow(2,(midi-69)/12);
  }
  function play(letter, oct, sharp, el){
    const ctx = ensureCtx();
    const freq = freqOf(letter,oct,sharp);
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type='triangle'; osc.frequency.value = freq;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.4, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+1.1);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now+1.15);
    if (el){ el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),160); }
  }
  function buildKeyboard(){
    pianoEl.innerHTML = '';
    whiteSeq.forEach(letter=>{
      const w = document.createElement('div');
      w.className='pkey white'; w.dataset.letter=letter; w.dataset.oct=octave;
      w.innerHTML = `<span class="lbl">${FR_NOTE[letter]}</span>`;
      w.addEventListener('pointerdown', ()=>play(letter,octave,false,w));
      pianoEl.appendChild(w);
      if (blackAfter[letter]){
        const b = document.createElement('div');
        b.className='pkey black'; b.dataset.letter=letter; b.dataset.oct=octave;
        b.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); play(letter,octave,true,b); });
        pianoEl.appendChild(b);
      }
    });
    octLabel.textContent = 'Octave ' + octave;
  }
  buildKeyboard();
  document.getElementById('oct-up').addEventListener('click', ()=>{ octave=Math.min(6,octave+1); buildKeyboard(); });
  document.getElementById('oct-down').addEventListener('click', ()=>{ octave=Math.max(2,octave-1); buildKeyboard(); });
  function onKey(e){
    const k = e.key.toLowerCase();
    if (keyMapWhite[k]) play(keyMapWhite[k], octave, false);
    else if (keyMapBlack[k]) play(keyMapBlack[k], octave, true);
  }
  window.addEventListener('keydown', onKey);
  return function cleanup(){ window.removeEventListener('keydown', onKey); if(audioCtx) audioCtx.close(); };
}
