/* ======================================================================
   JEU: RYTHME
====================================================================== */
function renderRhythmGame(){
  $view.innerHTML = `
    ${crumb('#/jeux','Tous les jeux')}
    <div class="game-shell">
      <div class="section-head"><h2>Jeu de rythme</h2></div>
      <p class="game-intro">Un motif de 8 temps va défiler. Appuie sur le pavé (ou la barre espace) exactement au moment de chaque note surlignée. Lance-le puis reste concentré sur le tempo !</p>
      <div class="game-hud">
        <div class="hud-stat"><b id="rg-score">—</b>précision</div>
        <div class="hud-stat"><b id="rg-bpm">88</b>bpm</div>
      </div>
      <div class="beat-row" id="rg-beats"></div>
      <button class="tap-pad" id="rg-tap">Lancer le motif</button>
      <div class="hit-row" id="rg-hits"></div>
      <div class="feedback" id="rg-feedback">&nbsp;</div>
    </div>
  `;
  const beatsEl = document.getElementById('rg-beats');
  const tapBtn = document.getElementById('rg-tap');
  const hitsEl = document.getElementById('rg-hits');
  const feedback = document.getElementById('rg-feedback');
  const scoreEl = document.getElementById('rg-score');
  const BPM = 88;
  const beatDur = 60/BPM;
  let pattern = [];
  let running = false, startTime=0, expected=[], hits=[], idx=0, audioCtx=null, timeouts=[];

  function genPattern(){
    pattern = [];
    for (let i=0;i<8;i++) pattern.push(Math.random()<0.3 ? 'eighth' : 'quarter');
  }
  function drawPattern(){
    beatsEl.innerHTML = '';
    let t=0;
    expected = [];
    pattern.forEach((kind)=>{
      const div = document.createElement('div');
      div.className = 'beat-note';
      div.innerHTML = `<svg viewBox="0 0 20 40"><text x="10" y="30" text-anchor="middle" font-size="26" fill="var(--fg)">${kind==='eighth'?'♪':'♩'}</text></svg>`;
      beatsEl.appendChild(div);
      expected.push(t);
      t += kind==='eighth' ? beatDur/2 : beatDur;
      if (kind==='eighth'){
        expected.push(t);
        t += beatDur/2;
      }
    });
  }
  function click(time){
    const ctx = audioCtx;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.frequency.value = 1000;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(0.25, time+0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+0.05);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(time); osc.stop(time+0.06);
  }
  function startRound(){
    genPattern(); drawPattern();
    hitsEl.innerHTML = expected.map(()=> '<div class="hit"></div>').join('');
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==='suspended') audioCtx.resume();
    running = true; idx = 0; hits = [];
    startTime = audioCtx.currentTime + 0.3;
    expected.forEach((t)=> click(startTime+t) );
    const noteDivs = beatsEl.children;
    let di=0;
    pattern.forEach((kind,i)=>{
      const localExpected = kind==='eighth' ? [expected[di], expected[di+1]] : [expected[di]];
      di += kind==='eighth' ? 2 : 1;
      const delayMs = (startTime + localExpected[0] - audioCtx.currentTime)*1000;
      timeouts.push(setTimeout(()=>{ noteDivs[i].classList.add('active'); setTimeout(()=>noteDivs[i].classList.remove('active'),140); }, Math.max(0,delayMs)));
    });
    const endDelay = (startTime + expected[expected.length-1] + beatDur - audioCtx.currentTime)*1000;
    timeouts.push(setTimeout(endRound, endDelay));
    tapBtn.textContent = 'En écoute… tape en rythme !';
    feedback.innerHTML='&nbsp;';
  }
  function registerTap(){
    if (!running) { startRound(); return; }
    const now = audioCtx.currentTime;
    const elapsed = now - startTime;
    let bestI = -1, bestD = Infinity;
    expected.forEach((t,i)=>{
      if (hits[i]) return;
      const d = Math.abs(t-elapsed);
      if (d<bestD){ bestD=d; bestI=i; }
    });
    if (bestI===-1) return;
    hits[bestI]=true;
    const hitDiv = hitsEl.children[bestI];
    if (bestD<0.09){ hitDiv.classList.add('good'); }
    else if (bestD<0.2){ hitDiv.classList.add('mid'); }
    else { hitDiv.classList.add('bad'); }
  }
  function endRound(){
    running=false;
    tapBtn.textContent = 'Rejouer le motif';
    const good = hitsEl.querySelectorAll('.good').length;
    const mid = hitsEl.querySelectorAll('.mid').length;
    const totalN = expected.length;
    const pct = Math.round(((good + mid*0.5) / totalN)*100);
    scoreEl.textContent = pct+'%';
    feedback.className = 'feedback ' + (pct>=70?'ok':'no');
    feedback.textContent = pct>=85 ? 'Excellent tempo !' : pct>=60 ? "Pas mal, continue à t'entraîner." : 'Concentre-toi sur la pulsation régulière.';
    recordScore('rythme', pct, 100);
  }
  tapBtn.addEventListener('click', registerTap);
  function onSpace(e){ if (e.code==='Space'){ e.preventDefault(); registerTap(); } }
  window.addEventListener('keydown', onSpace);
  drawPattern();
  return function cleanup(){ timeouts.forEach(clearTimeout); window.removeEventListener('keydown', onSpace); };
}

/* ======================================================================
   JEU: TONALITÉS
====================================================================== */
// French display name + ABC key name for each major key, in standard key-signature order.
const SHARP_KEYS = ['Do','Sol','Ré','La','Mi','Si','Fa♯','Do♯'];
const SHARP_ABC   = ['C','G','D','A','E','B','F#','C#'];
const FLAT_KEYS  = ['Do','Fa','Si♭','Mi♭','La♭','Ré♭','Sol♭','Do♭'];
const FLAT_ABC    = ['C','F','Bb','Eb','Ab','Db','Gb','Cb'];

function renderKeyGame(){
  $view.innerHTML = `
    ${crumb('#/jeux','Tous les jeux')}
    <div class="game-shell">
      <div class="section-head"><h2>Jeu des tonalités</h2></div>
      <p class="game-intro">Observe l'armure (les dièses ou les bémols en début de portée) et retrouve la tonalité majeure correspondante.</p>
      <div class="game-hud">
        <div class="hud-stat"><b id="kg-score">0</b>score</div>
        <div class="hud-stat"><b id="kg-total">0</b>essais</div>
      </div>
      <div class="staff-box"><div class="abc-notation" id="kg-staff"></div></div>
      <div class="answers" id="kg-answers"></div>
      <div class="feedback" id="kg-feedback">&nbsp;</div>
    </div>
  `;
  const answersEl = document.getElementById('kg-answers');
  const feedback = document.getElementById('kg-feedback');
  const scoreEl = document.getElementById('kg-score');
  const totalEl = document.getElementById('kg-total');
  let score=0,total=0, currentKey='', roundActive=true;

  function newRound(){
    const useSharp = Math.random()<0.5;
    const n = Math.floor(Math.random()*8); // 0..7 accidentals — abcjs draws any of them correctly
    const keys = useSharp ? SHARP_KEYS : FLAT_KEYS;
    const abcKeys = useSharp ? SHARP_ABC : FLAT_ABC;
    currentKey = keys[n];
    // An invisible spacer ('y') keeps the staff width consistent while showing only clef + key signature.
    renderABC('kg-staff', abcTune('treble', 'y', abcKeys[n]), {staffwidth:260, scale:1.15});
    const pool = Array.from(new Set([...SHARP_KEYS,...FLAT_KEYS]));
    const opts = new Set([currentKey]);
    while (opts.size<5) opts.add(pool[Math.floor(Math.random()*pool.length)]);
    const arr = Array.from(opts).sort(()=>Math.random()-0.5);
    answersEl.innerHTML = arr.map(k=>`<button class="ans-btn" data-k="${k}">${k}</button>`).join('');
    feedback.innerHTML='&nbsp;'; roundActive=true;
  }
  answersEl.addEventListener('click',(e)=>{
    const btn = e.target.closest('.ans-btn'); if (!btn||!roundActive) return;
    roundActive=false; total++; totalEl.textContent=total;
    if (btn.dataset.k===currentKey){
      score++; scoreEl.textContent=score; btn.classList.add('correct');
      feedback.textContent='Exact, '+currentKey+' majeur.'; feedback.className='feedback ok';
    } else {
      btn.classList.add('wrong');
      answersEl.querySelectorAll('.ans-btn').forEach(b=>{ if(b.dataset.k===currentKey) b.classList.add('correct'); });
      feedback.textContent = "C'était "+currentKey+' majeur.'; feedback.className='feedback no';
    }
    recordScore('tonalites', score, total);
    setTimeout(newRound, 900);
  });
  newRound();
}

/* ======================================================================
   THÈME
====================================================================== */
const themeBtn = document.getElementById('theme-toggle');
const THEME_CYCLE = ['', 'light', 'dark', 'contrast'];
const THEME_META = {
  '': {icon:'◐', label:'Thème automatique (suit votre appareil)'},
  'light': {icon:'☀', label:'Thème clair'},
  'dark': {icon:'☾', label:'Thème sombre'},
  'contrast': {icon:'◧', label:'Thème contraste élevé, pour malvoyants'}
};
function applyThemeIcon(){
  const t = document.documentElement.getAttribute('data-theme') || '';
  const meta = THEME_META[t];
  themeBtn.textContent = meta.icon;
  themeBtn.setAttribute('aria-label', meta.label + ' — cliquer pour changer de thème');
  themeBtn.setAttribute('title', meta.label);
}
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme') || '';
  const next = THEME_CYCLE[(THEME_CYCLE.indexOf(cur)+1) % THEME_CYCLE.length];
  if (next) { document.documentElement.setAttribute('data-theme', next); try{localStorage.setItem('solfege_theme',next);}catch(e){} }
  else { document.documentElement.removeAttribute('data-theme'); try{localStorage.removeItem('solfege_theme');}catch(e){} }
  applyThemeIcon();
  toast(THEME_META[next].label);
});
try{ const saved = localStorage.getItem('solfege_theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); }catch(e){}
applyThemeIcon();
